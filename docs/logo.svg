<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient: Deep Slate to Midnight -->
    <linearGradient id="nk_bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>

    <!-- Glass Rim Highlight -->
    <linearGradient id="nk_rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.45" />
      <stop offset="35%" stop-color="#10B981" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6" />
    </linearGradient>

    <!-- Ambient Core Glow -->
    <radialGradient id="nk_ambient_glow" cx="50%" cy="56%" r="48%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.32" />
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </radialGradient>

    <!-- Left Pillar Gradient: Emerald Teal to Deep Green -->
    <linearGradient id="nk_stem_left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Right Pillar Gradient: Cyan to Sky Blue -->
    <linearGradient id="nk_stem_right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Dynamic Diagonal Ribbon: Neon Mint to Cyber Cyan -->
    <linearGradient id="nk_diagonal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="25%" stop-color="#10B981" />
      <stop offset="75%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Caret Accent Gradient: Mint to Electric Cyan -->
    <linearGradient id="nk_caret_grad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Diagonal Inner Specular Highlight -->
    <linearGradient id="nk_diag_shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Squircle Drop Shadow for App Launcher -->
    <filter id="nk_squircle_shadow" x="-15%" y="-10%" width="130%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.4" />
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.25" />
    </filter>

    <!-- 3D Layer Overlap Shadow for the Diagonal Stem -->
    <filter id="nk_layer_shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="-1" dy="3" stdDeviation="3.5" flood-color="#030712" flood-opacity="0.65" />
    </filter>

    <!-- Caret Glow -->
    <filter id="nk_caret_glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1" stdDeviation="2.5" flood-color="#06B6D4" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Squircle Base with Soft Shadow -->
  <g filter="url(#nk_squircle_shadow)">
    <rect x="10" y="10" width="108" height="108" rx="26" fill="url(#nk_bg)" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.6" />
    <!-- 1px Subtle Glass Rim Highlight -->
    <rect x="10.5" y="10.5" width="107" height="107" rx="25.5" fill="none" stroke="url(#nk_rim)" stroke-width="1.2" />
  </g>

  <!-- Ambient Light Aura behind Letter N -->
  <rect x="10" y="10" width="108" height="108" rx="26" fill="url(#nk_ambient_glow)" />

  <!-- Vietnamese Circumflex Caret (Dấu Mũ Tiếng Việt) -->
  <g filter="url(#nk_caret_glow)">
    <path d="M51 28 L64 17.5 L77 28" fill="none" stroke="url(#nk_caret_grad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Monogram N Structure -->
  <g id="monogram_n">
    <!-- Left Pillar (Base Layer) -->
    <rect x="33" y="38" width="13" height="54" rx="6.5" fill="url(#nk_stem_left)" />

    <!-- Right Pillar (Base Layer) -->
    <rect x="82" y="38" width="13" height="54" rx="6.5" fill="url(#nk_stem_right)" />

    <!-- Dynamic Diagonal Ribbon with 3D Overlap Shadow -->
    <g filter="url(#nk_layer_shadow)">
      <line x1="39.5" y1="44.5" x2="88.5" y2="85.5" stroke="url(#nk_diagonal)" stroke-width="13" stroke-linecap="round" />
      <!-- High-tech Inner Specular Highlight on Diagonal -->
      <line x1="39.5" y1="44.5" x2="64" y2="65" stroke="url(#nk_diag_shine)" stroke-width="2" stroke-linecap="round" opacity="0.65" />
    </g>

    <!-- Subtle Top-cap Glow Accents on Left & Right Pillars -->
    <circle cx="39.5" cy="44.5" r="4.5" fill="#A7F3D0" opacity="0.45" />
    <circle cx="88.5" cy="44.5" r="4.5" fill="#BAE6FD" opacity="0.45" />
  </g>
</svg>
