<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient: Deep Slate to Midnight -->
    <linearGradient id="v_bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>

    <!-- Glass Rim Highlight -->
    <linearGradient id="v_rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDA4AF" stop-opacity="0.45" />
      <stop offset="35%" stop-color="#F43F5E" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6" />
    </linearGradient>

    <!-- Ambient Core Glow (Ruby / Rose) -->
    <radialGradient id="v_ambient" cx="50%" cy="56%" r="48%">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.32" />
      <stop offset="50%" stop-color="#BE123C" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </radialGradient>

    <!-- Left Stroke: Rose to Ruby -->
    <linearGradient id="v_left_stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="50%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>

    <!-- Right Stroke: Crimson to Sunset Coral -->
    <linearGradient id="v_right_stroke" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#E11D48" />
      <stop offset="50%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#FDA4AF" />
    </linearGradient>

    <!-- Specular Shine -->
    <linearGradient id="v_shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadow Filters -->
    <filter id="v_squircle_shadow" x="-15%" y="-10%" width="130%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.4" />
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.25" />
    </filter>

    <!-- 3D Layer Overlap Shadow for Left Diagonal -->
    <filter id="v_layer_shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="1" dy="3" stdDeviation="3.5" flood-color="#030712" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Base Squircle with Soft Shadow -->
  <g filter="url(#v_squircle_shadow)">
    <rect x="10" y="10" width="108" height="108" rx="26" fill="url(#v_bg)" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.6" />
    <!-- 1px Subtle Glass Rim Highlight -->
    <rect x="10.5" y="10.5" width="107" height="107" rx="25.5" fill="none" stroke="url(#v_rim)" stroke-width="1.2" />
  </g>

  <!-- Ambient Light Aura behind Letter V -->
  <rect x="10" y="10" width="108" height="108" rx="26" fill="url(#v_ambient)" />

  <!-- Monogram V Structure -->
  <g id="monogram_v">
    <!-- Right diagonal (Lower layer) -->
    <line x1="64" y1="92" x2="94" y2="34" stroke="url(#v_right_stroke)" stroke-width="15" stroke-linecap="round" />

    <!-- Left diagonal (Overlapping layer with soft shadow) -->
    <g filter="url(#v_layer_shadow)">
      <line x1="34" y1="34" x2="64" y2="92" stroke="url(#v_left_stroke)" stroke-width="15" stroke-linecap="round" />
      <!-- Specular Highlight Line -->
      <line x1="34" y1="34" x2="52" y2="68" stroke="url(#v_shine)" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />
    </g>

    <!-- Top-right highlight accent -->
    <circle cx="94" cy="34" r="5" fill="#FECDD3" opacity="0.4" />
  </g>
</svg>
